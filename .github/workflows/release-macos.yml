name: Release macOS (phenotype-tooling)

# Calls the reusable workflow at kooshapari/phenotype-fleet-ops.
# Self-hosted runners only (zero billed minutes).
# All Apple Developer secrets live in Infisical project 8efe392e-56a6-4c3c-89f9-8141183dd7e8.

on:
  push:
    tags:
      - "phenotype-tooling-*"
  workflow_dispatch:

concurrency:
  group: macos-release-phenotype-tooling-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: Build, sign, notarize phenotype-tooling
    uses: kooshapari/phenotype-fleet-ops/.github/workflows/macos-release.yml@9482260ce07b8c37394358b98d2eb413ab813ec3
    with:
      app-name: phenotype-tooling
      app-bundle-id: ai.phenotype.melosviz
      build-cmd: |
          cd apps/tooling
          bun install --frozen-lockfile
          bun run tauri build --target universal-apple-darwin
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/phenotype-tooling.app ../../dist/macos/
      entitlements-file: apps/tooling/src-tauri/Entitlements.plist
      artifact-dir: dist/macos
      create-dmg: true
      sign-identity: "Developer ID Application"
    secrets:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}

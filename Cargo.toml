[workspace]
resolver = "2"
members = [
    "crates/acceptance-contract",
    "crates/dag-scheduler",
    "crates/docs-health",
    "crates/fr-trace",
    "crates/qgate",
    "crates/legacy-scan",
    "crates/agent-orchestrator",
    "crates/audit-privacy",
    "crates/bench-guard",

    "crates/commit-msg-check",
    "crates/doc-link-check",
    "crates/fr-coverage",
    "crates/release-cut",
    "crates/sbom-gen",
    "crates/fuzz-setup",
    "crates/anthropic-usage-poll",
    "crates/agent-forecast",
    "crates/temporal-grounding",
    "crates/phenotype-resilience",
    "crates/phenotype-service-registry",
    "crates/phenotype-config",
    "crates/phenotype-diff",
    "crates/worktree-manager",
    "crates/phenotype-tooling-observability",
    "crates/phenotype-cli",
    "crates/phinbox",
    "crates/perfharness",
    "crates/ptx",
    "crates/pheno-forge-scaffold",
    "crates/tasken",
    "crates/tokn-pareto-rs",
    "crates/tokn-tokenledger",
    # PhenoJourneys Rust CLI (absorbed from KooshaPari/zz-merge-unk-PhenoJourneys)
    "crates/phenotype-journey-core",
    "crates/klipdot-capture",
    "crates/phenotype-journeys-observability",
    # PhenoPlugins (absorbed from KooshaPari/zz-merge-unk-PhenoPlugins)
    "crates/phenotype-plugins/pheno-plugin-core",
    "crates/phenotype-plugins/pheno-plugin-git",
    "crates/phenotype-plugins/pheno-plugin-sqlite",
    "crates/phenotype-plugins/pheno-plugin-vessel",
    "crates/phenotype-plugins/pheno-plugin-examples",
    "bin/hook-entry",
    "bin/phenotype-journey",
    # New phenotype crates from main
    "crates/phenotype-cache-adapter",
    "crates/phenotype-contracts",
    "crates/phenotype-cost-core",
    "crates/phenotype-event-sourcing",
    "crates/phenotype-observability",
    "crates/phenotype-policy-engine",
    "crates/phenotype-state-machine",

    # Absorbed from zz-merge-unk-PhenoUtils (CLI shells, async FS, crypto, network, testing)
    "crates/pheno-shell",
    "crates/pheno-fs",
    "crates/pheno-crypto",
    "crates/pheno-net",
    "crates/pheno-testing",
    "crates/pheno-schema-port",
    "crates/pheno-terminal",

    # Eye-tracking library (absorbed from KooshaPari/zz-merge-unk-eyetracker)
    "crates/eyetracker-domain",
    "crates/eyetracker-math",
    "crates/eyetracker-core",
    "crates/eyetracker-camera",
    "crates/eyetracker-inference",
    "crates/eyetracker-cli",
    "crates/eyetracker-ffi",
    # Absorbed from PhenoVCS
    "crates/airlock-v2",
    "crates/pheno-vcs-core",
    "crates/pheno-tracing",
    "crates/phenovcs-observability",
    "crates/clap-ext",
    "ports-vcs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Phenotype tooling ecosystem — CI, quality gates, release automation, and developer workflow tooling"
license = "MIT"
repository = "https://github.com/KooshaPari/phenotype-tooling"
documentation = "https://github.com/KooshaPari/phenotype-tooling#readme"
authors = ["Phenotype Contributors"]
rust-version = "1.75"
keywords = ["phenotype", "tooling", "ci", "quality-gates", "release-automation", "developer-workflow"]
categories = ["development-tools::build-utils", "development-tools::testing"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
walkdir = "2.5"
thiserror = "2.0"
regex = "1.11"
serde_yaml = "0.9"
reqwest = { version = "0.13", features = ["blocking", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.8", features = ["html_reports"] }
# PhenoPlugins additions
async-trait = "0.1"
git2 = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
# PhenoPlugins internal path deps
pheno-plugin-core = { path = "crates/phenotype-plugins/pheno-plugin-core" }

# Absorbed from PhenoVCS
pheno-tracing = { path = "crates/pheno-tracing", default-features = false }
clap-ext = { path = "crates/clap-ext" }
phenovcs-observability = { path = "crates/phenovcs-observability" }
pheno-vcs-core = { path = "crates/pheno-vcs-core" }

[profile.release]
lto = "thin"
codegen-units = 1

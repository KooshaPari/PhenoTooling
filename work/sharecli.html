          <h1 id="sharecli-static-title">ShareCLI Runtime Workbench</h1>
          <p>This is an illustrative, evidence-labelled model of the documented runtime flow, not a captured terminal session.</p>
          <ol aria-label="Illustrative ShareCLI runtime states">
            <li><strong>Burst</strong> &mdash; concurrent work enters the runtime boundary.</li>
            <li><strong>Coalesce</strong> &mdash; related work is grouped before dispatch.</li>
            <li><strong>Observe</strong> &mdash; queue and resource signals are inspected.</li>
            <li><strong>Recover</strong> &mdash; the runtime returns to a usable state.</li>
          </ol>

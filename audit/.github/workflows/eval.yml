name: Eval on Push

on:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run evaluation
        run: python3 eval.py run

      - name: Generate dashboard
        run: python3 eval.py dashboard

      - name: Check pass rates
        run: python3 check_scores.py

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: output/dashboard.html
